[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "password-manager-cli"
version = "0.1.0"
description = "Capstone CLI password manager with encrypted local vault"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
]

[project.scripts]
pwm = "password_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
